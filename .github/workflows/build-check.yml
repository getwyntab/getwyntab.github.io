name: PR build check

on:
    workflow_dispatch: {}
    pull_request:
      paths:
        - 'src/**'
        - 'package.json'
        - 'bun.lock'
        - '.github/workflows/build-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
    VITE_BASE: /
    VITE_HOSTNAME: https://getwyntab.github.io

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Build
              run: bun run build
